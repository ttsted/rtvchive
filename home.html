<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME</title>
    <link href="search.css" rel="stylesheet" type="text/css" media="all">
    <script src="script.js" defer></script>
  </head>
 
  <body>

<header>
  <div class="container header-content">

    <div class="search-bar">
      <input id="search" type="search" placeholder="&#x1F50D; Start typing to search..." list="search-suggestions" autocomplete="off"/>
      
      <datalist id="search-suggestions">
        <option value="JavaScript">
        <option value="CSS">
        <option value="Accessibility">
        <option value="Web Design">
      </datalist>
    </div>
  </div>
</header>

<main class="container">
  <div class="profile__posts">
    <div class="search-display"></div>
    <div class="card-header">
      <div class="card-header__title">Tutorials</div>
    </div>
    <div class="posts-container">
    </div>
  </div>
</main>
    
  </body>
</html>
